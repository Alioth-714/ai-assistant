[package]
name = "ai-assistant-app"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
ai-assistant = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "1", features = [] }
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
